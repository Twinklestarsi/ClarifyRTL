name: dac2026-c1
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - pip>=24,<26
  - verilator>=5,<6
  - iverilog>=11,<14
  - make
  - cxx-compiler
  - pkg-config
variables:
  PYTHONNOUSERSITE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"
