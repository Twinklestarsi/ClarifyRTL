# 八类需求缺失 → 八种“问题位（site）”模板（草案）
#
# 来源：DAG/DAG_实验流程对齐草案_2026-11-01.md §3.1。
# 用途：块 1 的版本化资源；块 2 的判定规则；块 3 的检查表；块 4 的问题边模板。
# 状态：draft —— site_objects 与 failure_modes 是待验证假设，必须由 capability/witnesses/ 的夹具证实
#       后才能把 verified 改成 true。未验证前不得据此宣称某问题“可问/不可问”。

schema_version: ir-petrinet-2
status: draft
site_status_codes:
  S0: 有位，值已拍定（缺证据），可直接问
  S1: 无位，选择被折进单个表达式，需拆分
  S2: 无位，概念被放在结构上天然最高优先的位置，需降级并记录表示取舍
  S3: 无位，schema 没有该概念，需扩 schema 或记 unaskable

categories:
  - id: C1
    name: 并发优先级缺失
    definition: 多个控制条件在同一拍同时有效时，谁覆盖谁没有写清楚。
    typical_questions:
      - clear、load、enable 同时有效时谁优先？
      - reset 与 full 同时有效时谁优先？
    site_template: priority_pick
    site_objects:
      - priority[] 的一条 higher/lower 边
      - sequential_processes[].transitions 中的相对位置
      - 各自独立的 transition 及其 guard
    failure_modes:
      S1: 生成器把多个条件折进一条 transition 的单个三元 RHS，问题只剩整条表达式可指
      S2: 复位被写成 clock_domains[].reset，backend 渲染为 if(reset) 覆盖，任何 transition 都压不过它
    repair:
      S1: 拆成独立 transition + 显式 priority 边
      S2: 把复位降级为普通 writer（去掉域级 reset），或显式化 override 关系对象
    witness: capability/witnesses/counter_reset_vs_full.md
    verified: false

  - id: C2
    name: 时序关系缺失
    definition: 结果同拍、下一拍还是固定若干拍返回，没有写清楚。
    typical_questions:
      - 结果是同拍还是下一拍？
      - 固定 3 拍延迟还是握手完成后 1 拍？
    site_template: stage_count
    site_objects:
      - pipeline_register 链的长度
      - 最后一级的 transition 及其 guard
      - timing[] 元数据（不驱动 RTL，只能作证据）
    failure_modes:
      S1: 延迟隐含在组合逻辑或 guard 里，没有独立的级数对象
      S1: validator 只接受 sequential latency ∈ {0,1}，多拍需要用参数化 generate 展开寄存器链
    repair:
      S1: 展开成显式 pipeline 寄存器链，每级一条 transition
      S1: 用模块参数作为 generate 边界，展开显式 pipeline 状态和 transition
    witness: capability/witnesses/memory_multicycle_gaps.md
    verified: false

  - id: C3
    name: 边界条件缺失
    definition: 满/空/上溢/下溢边界上的行为，以及与边界同拍发生的读写，没有写清楚。
    typical_questions:
      - FIFO 满时同拍读写是否允许？
      - 计数到最大值后回零、保持还是饱和？
    site_template: boundary_guard
    site_objects:
      - 某条 transition 的 guard 布尔式
      - 满/空派生信号（derived_signals）
      - 对应的 action / else_action
    failure_modes:
      S1: 边界分支被并进单个 RHS 三元式，边界条件没有独立 guard
    repair:
      S1: 拆出独立 transition，让边界成为可替换的 guard
    witness: null
    verified: false

  - id: C4
    name: 复位语义缺失
    definition: 同步/异步、有效电平、复位值、复位期间与复位后第一拍行为，没有写清楚。
    typical_questions:
      - 复位是同步还是异步、高有效还是低有效？
      - 复位期间 valid/ready 是否强制拉低？
      - 复位后第一个输出是什么？
    site_template: reset_semantics
    site_objects:
      - clock_domains[].reset_type
      - clock_domains[].reset_polarity
      - states[].reset_value / initial_value
      - 复位期输出的 guarded 赋值
    failure_modes:
      S2: 复位期输出行为没有对应对象，只能靠域级覆盖隐式决定
    repair:
      S2: 显式增加复位期的 guarded transition，或把复位输出行为放进独立 state
    witness: null
    verified: false

  - id: C5
    name: 握手协议缺失
    definition: valid/ready 的保持、撤销与反压期间的数据稳定性，没有写清楚。
    typical_questions:
      - valid 拉起后直到 ready 才撤销，还是每拍可重算？
      - 反压期间数据必须保持，还是允许下一拍换新？
    site_template: handshake_hold
    site_objects:
      - 握手状态（state + transition）
      - 该 state 在 action 中的出现/缺席
      - guard 中的 valid/ready 组合
    failure_modes:
      S1: “保持”靠对 target 不赋值隐式表达，没有可指的语句
      S2: “反压期间数据稳定”没有任何对象可指向
    repair:
      S1: 显式化保持（self-assignment）或加独立 holding 状态
      S2: 引入显式约束对象（扩 schema）或记 unaskable
    witness: null
    verified: false

  - id: C6
    name: 状态更新条件缺失
    definition: 暂停/空闲/异常时内部状态是保持、清零还是继续推进，没有写清楚。
    typical_questions:
      - 暂停时计数器、输出寄存器和内部状态是否都保持？
      - 出错后状态机回 IDLE 还是留在原地？
    site_template: hold_on_pause
    site_objects:
      - 暂停分支对每个 target 的显式赋值
      - 或独立的暂停 transition
    failure_modes:
      S1: 保持 = 该 target 不出现在任何 action 中，无法定位也无法打补丁
    repair:
      S1: 写成显式 self-assignment（x = x）；注意 validator 禁止 transition-local else_action 与其他 writer 共存，需先拆 writer
    witness: null
    verified: false

  - id: C7
    name: 冲突处理缺失
    definition: 同址读写、多端口写同址、多主竞争时的可见性，没有写清楚。
    typical_questions:
      - 同址同拍读写返回新值还是旧值？
      - 两个写端口同址时谁生效？
    site_template: mem_conflict
    site_objects:
      - states[].type = memory / ram 的 depth、width、ports
      - bypass 用的 derived_signals
    failure_modes:
      S3: memory 只有 depth/width/ports，没有 read-during-write 策略字段；backend 把写渲染成时钟块、读渲染成组合读，策略被隐式固定
    repair:
      S3: 扩 schema（新增策略字段 + backend lowering），或把读改成派生信号 + bypass mux（降级为 S1，但改变实现形态）
    witness: capability/witnesses/memory_multicycle_gaps.md
    verified: false

  - id: C8
    name: 数值及参数约束缺失
    definition: 位宽、最大值、溢出/饱和、参数合法范围，没有写清楚或与实现默认值不一致。
    typical_questions:
      - 计数到多少算满？位宽是多少？
      - 溢出时回绕还是饱和？
    site_template: width_overflow
    site_objects:
      - states[].width / datatype
      - module.parameters
      - 饱和/回绕的 RHS 表达式
      - data_model 的编码与变换
    failure_modes:
      S1: 溢出行为缺省即 Verilog 截断/回绕，没有可替换的饱和分支
    repair:
      S1: 显式写出饱和/回绕分支，使其成为可替换的 action
    witness: null
    verified: false

notes:
  - 一个类别在不同设计上可能落到不同 site_status；status 按“该 case 的实际 IR 实例”判定，不按类别一刀切。
  - site 的四条判据（可编译 / 局部 / 可指认 / 可观察）见 README §1。
  - S1/S2 属实例重构，不改 schema；S3 才需要改 schema。默认 allow_schema_extension=false，S3 记 unaskable。
